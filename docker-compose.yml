# ICT web UI — two-container deployment.
#
# Backend + frontend wired via a user-defined bridge network so the nginx
# reverse-proxy can reach the Go server by service name (`backend`).
# Only the frontend port is published to the host — the backend stays on
# the internal network.
#
# Bring up:
#   1. cp .env.example .env    # then fill in JENKINS_TOKEN etc.
#   2. docker compose build
#   3. docker compose up -d
#   4. open http://localhost:5173
#
# Stop:
#   docker compose down

# ------------------------------------------------------------------------------

services:
  pkgsvc:
    build:
      context: .
      dockerfile: Dockerfile.pkgsvc
    image: ict-pkgsvc:local
    # Not published in prod — the backend reaches it over the ict-ui
    # network. Uncomment for direct curl smoke tests during dev.
    # ports:
    #   - "9090:9090"
    environment:
      PKGSVC_LISTEN_ADDR:      ":9090"
      PKGSVC_CACHE_DIR:        "/var/lib/pkgsvc/cache"
      PKGSVC_INDEX_DIR:        "/var/lib/pkgsvc/index"
      PKGSVC_REFRESH_INTERVAL: "6h"
      PKGSVC_SOURCES:          "ubuntu:noble:amd64,debian:trixie:amd64"
      PKGSVC_UBUNTU_MIRROR:    "http://archive.ubuntu.com/ubuntu"
      PKGSVC_DEBIAN_MIRROR:    "http://deb.debian.org/debian"
      # Crawler is OFF by default. Migration step 1 ships the seed
      # corpus embedded via //go:embed and behaves byte-identically to
      # the pre-microservice era. Flip to "true" for step 2 (live
      # Ubuntu/Debian crawl).
      PKGSVC_CRAWLER_ENABLED:  "${PKGSVC_CRAWLER_ENABLED:-false}"
      PKGSVC_ADMIN_TOKEN:      ${PKGSVC_ADMIN_TOKEN:-}
      # Corporate-proxy passthrough for when the crawler is on.
      HTTP_PROXY:  ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY:    ${NO_PROXY:-}
    volumes:
      - pkgsvc-data:/var/lib/pkgsvc
    networks:
      - ict-ui
    restart: unless-stopped
    # Healthcheck baked into Dockerfile.pkgsvc (via the embedded
    # `ict-pkgsvc healthcheck` subcommand); declaring it here would be
    # redundant.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ict-ui-backend:local
    # NOT published to the host — the frontend proxies into it over the
    # ict-ui network. If you want to hit the backend directly (curl, dev
    # tooling), uncomment `ports:` below.
    # ports:
    #   - "8080:8080"
    env_file:
      - .env
    environment:
      # These are read from the shell / env_file at compose time. Kept
      # here so the required list is obvious. Missing JENKINS_* variables
      # make the /api/v1/jenkins/dispatch endpoint return 503, which the
      # frontend surfaces as a clear error.
      JENKINS_URL:          ${JENKINS_URL:-}
      JENKINS_USER:         ${JENKINS_USER:-}
      JENKINS_TOKEN:        ${JENKINS_TOKEN:-}
      JENKINS_WORKERS_PATH: ${JENKINS_WORKERS_PATH:-ict-farm/workers}
      # Reverse-proxy /api/v1/packages to the sidecar microservice. See
      # internal/api/handlers_packages.go — when this is empty, the
      # backend falls back to the embedded shard scan (migration
      # safety net, removed in step 4).
      PKGSVC_URL:           ${PKGSVC_URL:-http://pkgsvc:9090}
      # Proxy passthrough for Intel network. If unset in .env these
      # simply propagate empty and Go's http.Transport uses the direct
      # route — safe default.
      HTTP_PROXY:  ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY:    ${NO_PROXY:-}
    depends_on:
      pkgsvc:
        condition: service_healthy
    networks:
      - ict-ui
    restart: unless-stopped
    # 30s so the server can drain SSE streams before Docker escalates
    # to SIGKILL. Once we add signal.Notify + srv.Shutdown() in
    # internal/api/server.go this can drop to 10s.
    stop_grace_period: 30s
    # Healthcheck is baked into the Dockerfile; declaring it here would
    # be redundant. depends_on below waits for `service_healthy`.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ict-ui-frontend:local
    ports:
      # Host:container. Change the left side if 5173 collides on your
      # host (the Vite dev-server default). Container-side is fixed at
      # 8080 because nginx-unprivileged listens there.
      - "5173:8080"
    environment:
      # nginx templates `upstream backend { server ${BACKEND_URL}; }` at
      # container start via envsubst (see Dockerfile.frontend + the
      # NGINX_ENVSUBST_FILTER whitelist). For the local compose topology
      # that's just the sibling service name; a CaaS deployment sets
      # this to the routable host:port of the backend service (e.g.
      # `ict-backend.internal:8080` or the DNS name of a Kubernetes
      # Service).
      BACKEND_URL: ${BACKEND_URL:-backend:8080}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ict-ui
    restart: unless-stopped
    stop_grace_period: 10s

networks:
  ict-ui:
    driver: bridge

volumes:
  # Persists the pkgsvc microservice's Bleve mmap index + raw upstream
  # cache across container restarts. Without this the crawler re-fetches
  # every source on each `docker compose up`. Ephemeral in the
  # migration-step-1 embed-only mode (seed corpus is rebuilt from
  # //go:embed each start), but harmless there — the volume is small.
  pkgsvc-data:
